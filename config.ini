# Configuration for EGX Intelligence System

# Data Fetching Configuration
[fetching]
# Timeout for HTTP requests (in seconds)
timeout = 10

# Retry attempts for failed requests
max_retries = 3

# User agent for web scraping
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

# EGX Configuration
[egx]
# EGX announcements URL
announcements_url = "https://www.egx.com.eg/en/market-data/announcements"

# Maximum number of announcements to fetch per run
max_announcements = 100

# Search for specific keywords in announcements
keywords = ["profit", "dividend", "earnings", "acquisition", "merger"]

# FRA Configuration
[fra]
# Financial Regulatory Authority announcements URL
announcements_url = "https://www.fra.gov.eg/en/"

# Maximum number of announcements to fetch per run
max_announcements = 50

# News Sources Configuration
[news]
# List of news sources to fetch from
sources = ["mubasher", "arab-finance", "al-borsa", "hapi"]

# Maximum news items per source
max_items_per_source = 20

# News categories to focus on
categories = ["stocks", "bonds", "forex", "commodities", "market"]

# Signal Analysis Configuration
[analysis]
# Sentiment analysis threshold for bullish signals
bullish_threshold = 0.6

# Sentiment analysis threshold for bearish signals
bearish_threshold = 0.4

# Minimum strength required for significant signal
min_signal_strength = 2

# Report Generation Configuration
[reporting]
# Include statistics in report
include_statistics = true

# Include previous day comparison
include_comparison = true

# Number of top items to display per category
top_items_count = 5

# Email Configuration (optional)
[email]
# Enable email notifications
enabled = false

# SMTP server
smtp_server = "smtp.gmail.com"

# SMTP port
smtp_port = 587

# Email sender
sender_email = "your_email@gmail.com"

# Email recipients (comma-separated)
recipients = "investor1@example.com,investor2@example.com"

# Report subject
subject = "Daily EGX Intelligence Report"

# Logging Configuration
[logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = "INFO"

# Log file path
file = "logs/egx_intelligence.log"

# Maximum log file size in MB
max_size = 10

# Number of backup log files to keep
backup_count = 5

# Database Configuration (future enhancement)
[database]
# Enable database storage
enabled = false

# Database type (sqlite, postgresql, mysql)
type = "sqlite"

# Database path/connection string
connection = "data/egx_intelligence.db"

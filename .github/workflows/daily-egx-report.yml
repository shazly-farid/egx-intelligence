name: Daily EGX Intelligence Report

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Africa/Cairo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser python-dateutil

      - name: Create directories
        run: mkdir -p Scheduled data logs

      - name: Get date
        id: date
        run: |
          echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "yesterday=$(date -d yesterday +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run pipeline
        run: python3 scripts/run_pipeline.py || true

      - name: Ensure report exists
        run: |
          if [ ! -f "Scheduled/${{ steps.date.outputs.today }}.md" ]; then
            echo "# EGX Report" > "Scheduled/${{ steps.date.outputs.today }}.md"
            echo "Date: $(date)" >> "Scheduled/${{ steps.date.outputs.today }}.md"
          fi

      - name: Commit changes
        run: |
          git config user.name "EGX Bot"
          git config user.email "bot@egx.local"
          git add "Scheduled/${{ steps.date.outputs.today }}.md" || true
          git add data/*.json || true
          git diff --cached --quiet || git commit -m "Report: ${{ steps.date.outputs.today }}" || true
          git push || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.date.outputs.today }}
          path: Scheduled/
          retention-days: 30

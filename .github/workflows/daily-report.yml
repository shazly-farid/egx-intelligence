name: Daily EGX Intelligence Report

on:
  schedule:
    # Run daily at 8:00 AM Cairo time (UTC+2, so 6:00 AM UTC)
    - cron: '0 6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run EGX Intelligence Pipeline
        run: |
          python3 scripts/run_pipeline.py
      
      - name: Upload generated files
        uses: actions/upload-artifact@v3
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            data/
            reports/
          retention-days: 30
      
      - name: Commit and push report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ || true
          git add data/analysis_*.json || true
          git diff --cached --quiet || git commit -m "chore: Generate daily EGX report - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create issue on pipeline failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily EGX Report Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The daily EGX Intelligence pipeline failed on ${new Date().toISOString()}.\n\nCheck the workflow run: ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            })
